<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AudioPulse — Log In / Sign Up</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #f6f8fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      color: #1f2328;
      -webkit-font-smoothing: antialiased;
    }
    .auth-box {
      background: #ffffff;
      width: 100%;
      max-width: 360px;
      padding: 28px 24px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      box-shadow: 0 1px 3px rgba(31, 35, 40, 0.08);
    }
    h2 {
      margin-bottom: 6px;
      font-size: 20px;
      font-weight: 600;
      color: #1f2328;
      text-align: center;
    }
    .subtitle {
      font-size: 13px;
      color: #6e7781;
      text-align: center;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 14px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #24292f;
      margin-bottom: 5px;
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 7px 10px;
      font-size: 14px;
      border: 1px solid #d0d7de;
      border-radius: 4px;
      outline: none;
      background: #ffffff;
      color: #1f2328;
      transition: border-color 0.12s ease, box-shadow 0.12s ease;
    }
    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: #0969da;
      box-shadow: 0 0 0 1px #0969da;
    }
    .btn-submit {
      width: 100%;
      padding: 8px 14px;
      background: #0969da;
      color: #ffffff;
      border: 1px solid #0858b7;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.12s ease;
    }
    .btn-submit:hover:not(:disabled) {
      background: #0858b7;
    }
    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .toggle-link {
      margin-top: 18px;
      text-align: center;
      font-size: 13px;
      color: #57606a;
    }
    .toggle-link a {
      color: #0969da;
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;
    }
    .toggle-link a:hover {
      text-decoration: underline;
    }
    .message {
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 13px;
      margin-bottom: 14px;
      display: none;
    }
    .message.error {
      display: block;
      background: #ffebe9;
      color: #cf222e;
      border: 1px solid #ff8182;
    }
    .message.success {
      display: block;
      background: #dafbe1;
      color: #1a7f37;
      border: 1px solid #4ac26b;
    }
  </style>
</head>
<body>

  <div class="auth-box">
    <h2 id="formTitle">Log In</h2>
    <p class="subtitle" id="formSubtitle">Sign in to access AudioPulse</p>

    <div id="msg" class="message"></div>

    <form id="authForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter username" autocomplete="username" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter password" autocomplete="current-password" required>
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">Log In</button>
    </form>

    <div class="toggle-link">
      <span id="toggleText">Don't have an account?</span>
      <a id="toggleBtn">Sign Up</a>
    </div>
  </div>

  <script>
    let isSignUp = false;

    const formTitle = document.getElementById('formTitle');
    const formSubtitle = document.getElementById('formSubtitle');
    const submitBtn = document.getElementById('submitBtn');
    const toggleText = document.getElementById('toggleText');
    const toggleBtn = document.getElementById('toggleBtn');
    const authForm = document.getElementById('authForm');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const msg = document.getElementById('msg');

    // Check if already logged in
    fetch('/api/me')
      .then(res => res.json())
      .then(data => {
        if (data.authenticated) {
          window.location.href = '/index.html';
        }
      })
      .catch(() => {});

    // Toggle between Log In and Sign Up
    toggleBtn.addEventListener('click', () => {
      isSignUp = !isSignUp;
      msg.className = 'message';
      msg.style.display = 'none';

      if (isSignUp) {
        formTitle.textContent = 'Sign Up';
        formSubtitle.textContent = 'Create an account with your custom password';
        submitBtn.textContent = 'Sign Up';
        toggleText.textContent = 'Already have an account?';
        toggleBtn.textContent = 'Log In';
        passwordInput.autocomplete = 'new-password';
      } else {
        formTitle.textContent = 'Log In';
        formSubtitle.textContent = 'Sign in to access AudioPulse';
        submitBtn.textContent = 'Log In';
        toggleText.textContent = "Don't have an account?";
        toggleBtn.textContent = 'Sign Up';
        passwordInput.autocomplete = 'current-password';
      }
    });

    // Handle Form Submit
    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.className = 'message';
      msg.style.display = 'none';

      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      if (!username || !password) {
        showError('Please fill in both username and password.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = isSignUp ? 'Creating account...' : 'Logging in...';

      const endpoint = isSignUp ? '/api/signup' : '/api/login';

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (!res.ok) {
          showError(data.error || 'Authentication failed. Please try again.');
          submitBtn.disabled = false;
          submitBtn.textContent = isSignUp ? 'Sign Up' : 'Log In';
          return;
        }

        // Success
        showSuccess(isSignUp ? 'Account created! Redirecting...' : 'Login successful! Redirecting...');
        setTimeout(() => {
          window.location.href = '/index.html';
        }, 600);
      } catch (err) {
        showError('Network error. Please make sure the server is running.');
        submitBtn.disabled = false;
        submitBtn.textContent = isSignUp ? 'Sign Up' : 'Log In';
      }
    });

    function showError(text) {
      msg.className = 'message error';
      msg.textContent = text;
      msg.style.display = 'block';
    }

    function showSuccess(text) {
      msg.className = 'message success';
      msg.textContent = text;
      msg.style.display = 'block';
    }
  </script>
</body>
</html>
